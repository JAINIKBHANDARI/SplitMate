services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/splitmate
      NODE_ENV: production
      PORT: 4000
      COOKIE_SECURE: "false"
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
